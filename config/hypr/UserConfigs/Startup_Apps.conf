# Commands and Apps to be executed at launch

# ===== USER-SPECIFIC STARTUP APPS =====

# Rainbow borders
exec-once = $UserScripts/RainbowBorders.sh

# Keybinds layout init (required by v2.3.20)
exec-once = $scriptsDir/KeybindsLayoutInit.sh

# Wallpaper change on login (one-shot, also changes on lock via hypridle)
exec-once = $scriptsDir/WallpaperChange.sh ~/Pictures/wallpapers

# Memory pressure monitor (warns before oomd kills session)
exec-once = $scriptsDir/MemoryMonitor.sh
