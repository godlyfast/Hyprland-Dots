# For window rules
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more

# This file is used to add or overwrite window rules 
# This file will not be modified during dotfiles updates

# ===== USER-SPECIFIC WINDOW RULES =====

# Unreal Tournament 99 (native) - tearing + opaque + no effects
windowrule = match:class ^(ut-bin-amd64)$, immediate 1
windowrule = match:class ^(ut-bin-amd64)$, opaque 1
windowrule = match:class ^(ut-bin-amd64)$, no_blur 1
windowrule = match:class ^(ut-bin-amd64)$, no_shadow 1
windowrule = match:class ^(ut-bin-amd64)$, no_dim 1

# Layer rules now belong in UserConfigs/LayerRules.conf
