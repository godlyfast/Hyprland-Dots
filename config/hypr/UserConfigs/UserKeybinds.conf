# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #
# This is where you put your own keybinds. Be Mindful to check as well ~/.config/hypr/configs/Keybinds.conf to avoid conflict
# if you think I should replace the Pre-defined Keybinds in ~/.config/hypr/configs/Keybinds.conf , submit an issue or let me know in DC and present me a valid reason as to why, such as conflicting with global shortcuts, etc etc

# See https://wiki.hyprland.org/Configuring/Keywords/ for more settings and variables
# See also Laptops.conf for laptops keybinds 

# /* ---- ✴️ Variables ✴️ ---- */  #
$mainMod = SUPER
$scriptsDir = $HOME/.config/hypr/scripts
$UserScripts = $HOME/.config/hypr/UserScripts
$UserConfigs = $HOME/.config/hypr/UserConfigs

#  IMPORTANT: If you want to remap and existing keybind you MUST unbindd it first 

# The bindings are CASE SENSITIVE. We suggest you copy the exisitng binding here
#  Then change `bindd` to `unbind`

# E.g. 
# unbind = $mainMod, Return, Open terminal, exec, $term
# bindd = $mainMod, Return, Open terminal, exec, ghostty 
#
# unbind = $mainMod, E, file manager, exec, $files
# bindd = $mainMod, T, file manager, exec, $files

# If you are ADDING a bindd, make sure you include the description 
# Other the keybind search menu might not show it properly 

# E.g.
# bindd = $mainMod, Z, My z app, exec APPNAME

##############
#  Rebinds   #
##############


##############
#  unbinds   #
##############




# ===== USER-SPECIFIC KEYBINDS =====

# Email client
unbind = $mainMod SHIFT, T, DropDown terminal, exec, $scriptsDir/Dropterminal.sh $term
bindd = $mainMod SHIFT, T, email (Thunderbird), exec, thunderbird

# Web browsers
bindd = $mainMod SHIFT, C, Chrome browser, exec, google-chrome-stable
# stock binds SUPER+SHIFT+B to RainbowBorders-low-cpu; brave wins here
unbind = $mainMod SHIFT, B
bindd = $mainMod SHIFT, B, Brave browser, exec, brave

# Booru Anime Sidebar
bindd = $mainMod CTRL SHIFT, B, toggle Booru sidebar, exec, $scriptsDir/SidebarToggle.sh

# GPU/power status notification
bindd = $mainMod ALT, I, show GPU/power status, exec, $scriptsDir/StatusCheck.sh

# Scheduler mode cycle
bindd = $mainMod ALT, S, cycle scheduler modes, exec, $scriptsDir/SchedulerSwitch.sh

# HyprWave music visualizer
bindd = $mainMod ALT, M, toggle HyprWave visibility, exec, hyprwave-toggle visibility
bindd = $mainMod CTRL, M, toggle HyprWave expand, exec, hyprwave-toggle expand

# Toggle floating (Super+F); stock "Maximize window" moved to Super+Ctrl+F
unbind = $mainMod, F
bindd = $mainMod, F, toggle floating, togglefloating,
bindd = $mainMod CTRL, F, maximize window, fullscreen, 1

# Keyboard layout switch (Super+Space for UA/EN) - unbind default float toggle first
unbind = $mainMod, SPACE
bindd = $mainMod, SPACE, switch keyboard layout, exec, $scriptsDir/SwitchKeyboardLayout.sh

# Waybar layout menu: use stock $mainMod ALT, B (configs/Keybinds.conf) — no override needed

# Manual wallpaper change (with wallust colors)
bindd = $mainMod ALT, W, change wallpaper, exec, $scriptsDir/WallpaperChange.sh


# For passthrough keyboard into a VM
# bind = $mainMod ALT, P, submap, passthru
#submap = passthru
# to unbind
#bind = $mainMod ALT, P, submap, reset
#submap = reset
